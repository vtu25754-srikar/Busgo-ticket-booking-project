<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile – BUSGO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
</head>
<body style="background-color:#f8fafc;">

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">🚌</div>
        <span>BUSGO</span>
      </a>

      <div class="nav-menu">
        <a href="index.html" class="nav-link">Search Buses</a>
        <a href="mybookings.html" class="nav-link">My Bookings</a>
      </div>

      <div class="nav-actions">
        <!-- Injected by main.js -->
      </div>
    </div>
  </nav>

  <!-- Profile Layout -->
  <div class="container" style="max-width: 800px; margin: 40px auto 60px;">
    <!-- Profile Header Card -->
    <div style="background:#ffffff; border-radius:12px; padding:24px; border:1px solid #e2e8f0; display:flex; align-items:center; gap:20px; margin-bottom:24px;">
      <div id="profileAvatarBig" style="width:64px; height:64px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700;">
        U
      </div>
      <div>
        <h2 id="profileGreetingName" style="font-size:20px; font-weight:700;">User Profile</h2>
        <span id="profileRoleBadge" class="badge badge-info" style="margin-top:4px;">CUSTOMER</span>
      </div>
    </div>

    <!-- Personal Information Card -->
    <div style="background:#ffffff; border-radius:12px; padding:30px; border:1px solid #e2e8f0; margin-bottom:24px;">
      <h3 style="font-size:17px; font-weight:700; margin-bottom:18px;">Personal Details</h3>
      <form id="updateProfileForm">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="profileName" class="form-control" required>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label">Email Address (Read-only)</label>
            <input type="email" id="profileEmail" class="form-control" readonly style="background:#f1f5f9; cursor:not-allowed;">
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="profilePhone" class="form-control" required pattern="[0-9]{10}">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
      </form>
    </div>

    <!-- Password Change Card -->
    <div style="background:#ffffff; border-radius:12px; padding:30px; border:1px solid #e2e8f0;">
      <h3 style="font-size:17px; font-weight:700; margin-bottom:18px;">Security & Password</h3>
      <form id="changePasswordForm">
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <input type="password" id="oldPassword" class="form-control" required>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label">New Password (Min. 6 chars)</label>
            <input type="password" id="newPassword" class="form-control" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" class="form-control" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn btn-secondary btn-sm">Update Password</button>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container" style="text-align:center;">
      <p style="font-size:13px;">&copy; 2026 BUSGO – Online Bus Ticket Booking & Reservation Platform.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
