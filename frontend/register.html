<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account – BUSGO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
</head>
<body style="background-color:#f1f5f9;">

  <!-- Simple Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">🚌</div>
        <span>BUSGO</span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Already registered? Login</a>
      </div>
    </div>
  </nav>

  <!-- Registration Card -->
  <div class="auth-page-wrapper">
    <div class="auth-card" style="max-width: 540px;">
      <div class="auth-header">
        <h2 class="auth-title">Create BUSGO Account</h2>
        <p class="auth-subtitle">Join thousands of travellers and operators across India</p>
      </div>

      <form id="registerForm">
        <!-- Role selector -->
        <div class="form-group">
          <label class="form-label">I want to register as a: *</label>
          <div style="display:flex; gap:20px; margin-top:6px;">
            <label style="display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; cursor:pointer;">
              <input type="radio" name="role" value="customer" checked style="accent-color:var(--primary);">
              Customer (Book Tickets)
            </label>
            <label style="display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; cursor:pointer;">
              <input type="radio" name="role" value="operator" style="accent-color:var(--primary);">
              Bus Operator (Manage Fleet)
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Anand Sharma" required>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
          <div class="form-group">
            <label class="form-label">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Mobile Number *</label>
            <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile" required pattern="[0-9]{10}">
          </div>
        </div>

        <!-- Conditional Operator Fields -->
        <div id="operatorFields" style="display:none; background:#f8fafc; padding:16px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:18px;">
          <h4 style="font-size:14px; margin-bottom:12px; color:var(--primary);">Bus Operator Information</h4>
          <div class="form-group">
            <label class="form-label">Travels / Agency Company Name *</label>
            <input type="text" id="companyName" class="form-control" placeholder="e.g. Royal Travels Pvt Ltd">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Commercial Transport License Number</label>
            <input type="text" id="licenseNumber" class="form-control" placeholder="e.g. DL-TC-2024-998">
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
          <div class="form-group">
            <label class="form-label">Create Password *</label>
            <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password *</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="6">
          </div>
        </div>

        <div style="margin-bottom:20px; font-size:12px; color:var(--text-muted); display:flex; align-items:flex-start; gap:8px;">
          <input type="checkbox" id="termsAgree" required checked style="accent-color:var(--primary); margin-top:2px;">
          <label for="termsAgree">I agree to BUSGO's Terms of Service, Privacy Policy, and cancellation rules.</label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Create Account
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:14px; color:var(--text-muted);">
        Already have an account? 
        <a href="login.html" style="color:var(--primary); font-weight:600;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
